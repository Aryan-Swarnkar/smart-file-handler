services:
  postgres:
    # v3 (Phase 2): plain postgres:16-alpine. pgvector is CUT; pg_trgm and
    # citext are in contrib and created by the initial migration.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_file_handler}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432" # host 5432 is taken by a stale stage-1 container (beta-db-1)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  s3:
    # SeaweedFS stands in for MinIO — verified 2026-11-14 that the MinIO
    # community edition is discontinued (minio/minio: 404 on Docker Hub;
    # dl.min.io releases: HTTP 410). User-approved substitution. Production
    # uses S3/R2 via aioboto3; only this dev container differs.
    # S3 API on 8333, master UI 9333.
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    command:
      - "server"
      - "-dir=/data"
      - "-ip.bind=0.0.0.0" # default binds container IP only -> breaks healthcheck
      - "-s3"
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "9000:8333" # host 9000 => .env S3_ENDPOINT_URL stays http://localhost:9000
      - "9333:9333"
    volumes:
      - s3_data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  clamav:
    # ClamAV clamd (scan pipeline, Phase 7). GPL-2.0 engine in a separately-run
    # container (license-flagged in MIGRATION_PLAN.md §7). No host port: only
    # api/worker talk to clamd, inside the compose network. First boot
    # downloads the signature DB (~250 MB) — generous start_period.
    image: clamav/clamav:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    mem_limit: 2g

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SECRET_KEY: ${SECRET_KEY}
      # Container-internal hostnames override the .env (env vars beat dotenv).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_file_handler}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      # Handed-out presigned URLs must be host-reachable (9000 is the host
      # mapping of s3:8333) — clients PUT straight to SeaweedFS.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-smart-file-handler}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    mem_limit: 512m
    # Healthcheck: python is in the image (curl is not).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  worker:
    # Celery worker: process_file state machine (Phase 6), scan/label
    # pipelines in Phase 7. Concurrency 1 for the ML worker (spec). Same
    # image, the Dockerfile's `worker` target.
    build:
      context: .
      target: worker
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_file_handler}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-smart-file-handler}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      ML_STUB: ${ML_STUB:-1}
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      clamav:
        condition: service_started

  beat:
    # Celery beat: schedules the periodic sweep (Phase 6). Separate container
    # so sweep scheduling has its own failure domain — relay down must not
    # stop sweeps, worker down must not stop scheduling.
    build:
      context: .
      target: worker
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_file_handler}
      REDIS_URL: redis://redis:6379/0
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
    mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy

  relay:
    # Outbox -> Celery relay (Phase 6): the single publisher from DB state to
    # the broker. The API never enqueues; the sweeper re-enqueues via outbox
    # rows. Python loop process (`python -m app.workers.relay`).
    build:
      context: .
      target: worker
    command: ["python", "-m", "app.workers.relay"]
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_file_handler}
      REDIS_URL: redis://redis:6379/0
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  s3_data:
