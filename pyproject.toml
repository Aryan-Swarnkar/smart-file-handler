[project]
name = "smart-file-handler"
version = "0.1.0"
description = "Async backend that auto-organizes uploads into smart categories: faces, things, document topics."
readme = "README.md"
# Pinned to the 3.12 line: torch/insightface/onnxruntime wheels are only guaranteed for it.
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- web layer (P0) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # --- data layer (P1/P2) ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.13",
    "pgvector>=0.3",
    # --- queue/cache (P1/P4) ---
    "redis>=5.1",
    "arq>=0.26",
    # --- object storage (P3) ---
    "aioboto3>=13.2",
    # --- security (P2) ---
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-aioboto3>=13.2",
]

[tool.uv]
# Application repo, not an installable package: `uv sync` only installs deps.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
# App repo (package=false): point pytest at the project root so `app` imports.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migrations are not hand-written code; don't lint/format them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "W", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
# Third-party ML libs ship no type stubs; strictness applies to our code only.
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["alembic/versions"]
