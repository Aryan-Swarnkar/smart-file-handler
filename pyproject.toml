[project]
name = "smart-file-handler"
version = "0.1.0"
description = "Async Drive-style file backend: folders, sharing, quotas, automated scan/label pipelines."
readme = "README.md"
# Pinned to the 3.12 line: ML wheels (torch etc., Phase 7) are only guaranteed for it.
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- web layer (P0) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # --- data layer (P1/P2) ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.13",
    # --- cache (rate limiting) ---
    # kombu 5.7's redis transport enforces redis-py >= 6.1 at runtime
    # (VersionMismatch crash otherwise); rate-limit usage is API-compatible.
    "redis>=6.1",
    # --- pipeline (Phase 6) ---
    # celery 5.7.0 imports packaging at worker/beat startup and in send_task,
    # but declares it nowhere (verified via importlib.metadata) — pinned
    # explicitly so container images get it too.
    "celery>=5.4",
    "packaging>=24",
    # --- object storage (P3) ---
    "aioboto3>=13.2",
    # --- security (P2) ---
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-aioboto3>=13.2",
]

[tool.uv]
# Application repo, not an installable package: `uv sync` only installs deps.
package = false
# Repo lives under OneDrive: hardlinked files break the cloud sync
# (os error 396 "incompatible hardlinks"). Copy mode keeps the venv syncable.
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
# App repo (package=false): point pytest at the project root so `app` imports.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migrations are not hand-written code; don't lint/format them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "W", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
# Third-party ML libs ship no type stubs; strictness applies to our code only.
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["alembic/versions"]
